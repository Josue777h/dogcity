<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="negu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container for high visibility on both light & dark search engines -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#00E5FF" stroke-width="6" stroke-opacity="0.25" />

  <!-- NEGU Stylized "N" Symbol -->
  <g transform="translate(100, 96) scale(0.61)" filter="url(#glow)">
    <!-- Left vertical bar -->
    <path d="M 40 40 L 130 40 L 130 472 L 40 472 Z M 70 70 L 100 70 L 100 442 L 70 442 Z" fill="url(#negu-grad)" />
    
    <!-- Right vertical bar -->
    <path d="M 382 40 L 472 40 L 472 472 L 382 472 Z M 412 70 L 442 70 L 442 442 L 412 442 Z" fill="url(#negu-grad)" />
    
    <!-- Diagonal futuristic tech bridge -->
    <!-- Top left section -->
    <polygon points="130,100 235,205 195,245 130,180" fill="url(#negu-grad)" />
    
    <!-- Central connecting nodes -->
    <rect x="220" y="220" width="72" height="72" rx="12" fill="#00E5FF" transform="rotate(45 256 256)" />
    <rect x="238" y="238" width="36" height="36" rx="6" fill="#0B1120" transform="rotate(45 256 256)" />
    
    <!-- Bottom right section -->
    <polygon points="382,412 277,307 317,267 382,332" fill="url(#negu-grad)" />
  </g>
</svg>